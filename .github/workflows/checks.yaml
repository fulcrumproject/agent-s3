name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go test -race ./...
      - run: go vet ./...
      - run: docker build -t agent-s3-check .
      - run: docker run --rm --read-only --cap-drop ALL agent-s3-check --help
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Prepare isolated dependencies
        run: |
          mkdir -p -m 700 .local
          python3 -m venv .local/venv
          .local/venv/bin/pip -q install -r tests/requirements.txt
          git clone --filter=blob:none --no-checkout https://github.com/fulcrumproject/core.git .local/core-source
          read -r revision < tests/core-revision
          git -C .local/core-source checkout --detach "$revision"
          CORE_DIR="$PWD/.local/core-source" bash scripts/prepare-e2e.sh
      - run: .local/venv/bin/python tests/backend_contract.py
      - run: .local/venv/bin/python tests/test_iam_boundaries.py
      - run: bash tests/network_boundary.sh
      - name: Real core and race-instrumented agent
        run: |
          go build -race -o .local/agent ./cmd/agent
          .local/venv/bin/python -u tests/e2e.py
      - name: Remove only CI fixtures
        if: always()
        run: |
          if [ -f .local/rustfs.env ] && [ -f .local/core.env ]; then
            docker compose --project-name fulcrum-s3-test --env-file .local/rustfs.env --env-file .local/core.env \
              -f compose.yaml -f compose.e2e.yaml down --volumes
          fi
