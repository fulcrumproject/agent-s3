# Customer HTTP endpoint: only path-style S3 in the agent-owned namespace.
# Preserve Host and the original URI for SigV4; never log signed URLs or credentials.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/null;
events { worker_connections 1024; }
http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8080;
        server_name _;
        client_max_body_size 0;
        default_type application/xml;
        error_page 403 = @denied;
        location @denied {
            if ($uri = /) {
                return 403 '<ErrorResponse><Error><Type>Sender</Type><Code>AccessDenied</Code><Message>Access denied</Message></Error></ErrorResponse>';
            }
            return 403 '<Error><Code>AccessDenied</Code><Message>Access denied</Message></Error>';
        }
        # GET / is S3 ListBuckets; POST / is RustFS STS and must never be forwarded.
        location = / {
            if ($request_method != GET) { return 403; }
            proxy_pass http://rustfs:9000;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
        }
        location ~ "^/fulcrum-[a-z0-9-]+(?:/|$)" {
            proxy_pass http://rustfs:9000;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
        # Includes all /rustfs/admin, /minio/admin, console and self-service routes.
        location / { return 403; }
    }
}
